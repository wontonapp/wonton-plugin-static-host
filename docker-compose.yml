# 示例插件：nginx 显示一个网页，向登录的人问好。改成自己的应用见 https://github.com/wontonapp/wonton-docs/blob/main/develop.md#写插件。
services:
  web:
    # 镜像按摘要固定（多架构镜像写清单列表的摘要），标签只给人看。
    image: nginx:1.31.8-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    environment:
      # 网关代登录：SSI 回显的 Remote-User 只信核心带来的。官方镜像启动时对 templates 目录里的
      # *.template 做 envsubst，把下面的地址换进 nginx 配置（见 web/default.conf.template）。
      WONTON_CORE_ADDRESS: ${WONTON_CORE_ADDRESS}
    # 包里的文件经 configs 交给容器（核心在启动前写进去），不能用卷挂载。
    configs:
      - source: site
        target: /etc/nginx/templates/default.conf.template
      - source: page
        target: /usr/share/nginx/html/index.html
      - source: tokens
        target: /usr/share/nginx/html/tokens.css
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

configs:
  site:
    file: web/default.conf.template
  page:
    file: web/index.html
  tokens:
    file: web/tokens.css

x-wonton:
  spec: "0.6"
  # 换成你自己的：反向域名形式，装上以后不能改。
  id: app.example.hello
  version: 0.1.1
  kind: app
  title: { zh: 你好, en: Hello }
  description: { zh: 向登录的人问好的示例网页, en: An example page that greets whoever is signed in }
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: Example }
  homepage: https://nginx.org
  # 应用（这里是 nginx）的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: BSD-2-Clause
  tags:
    zh: [工具]
    en: [Tools]
  about:
    zh: |
      一个示例网页：登录以后，页面会向你问好。新建插件时可以照着改。
    en: |
      An example page: once you are signed in, the page says hello. Copy it as a starting point for a new plugin.
  release_notes: { zh: 名字和说明更新。, en: Product name and description update. }
  webui:
    service: web
    port: 80
    # 示例页回显网关注入的用户名，见 https://github.com/wontonapp/wonton-docs/blob/main/plugin-spec.md#网关代登录sso-proxy。
    sso: proxy
    proxy:
      headers:
        Remote-User: "{user}"
  # 能放进侧边栏“我的应用”的页面，见 https://github.com/wontonapp/wonton-docs/blob/main/plugin-spec.md#应用页面tabs。放不放由用户决定。
  tabs:
    - id: home
      title: { zh: 主页, en: Home }
      icon: tabs/home.svg
      icon_selected: tabs/home-fill.svg
      path: /
      # 这个页面没做适配，用默认的 inset：从状态栏下沿开始，页面不用管安全区。
      # 想让内容从状态栏后面滚过，写 layout: edge-to-edge，并用 --wonton-inset-* 留出系统安全区的位置。
  permissions: []
  # 上游 nginx 官方镜像，amd64 和 arm64 都有；上游没写最低内存，按本机空闲实测取整（实测约 24M，取 64M）。
  requirements:
    arch: [amd64, arm64]
    memory: 64M
