services:
  # static_web：Caddy 官方镜像，配置只有 Caddyfile。核心把 <核心数据目录>/hosted/static_web/ 只读挂到
  # provides.static_web.mount，不写在这里。
  static:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    # Caddy 只读文件、不写自己的 /data 和 /config（admin、自动 HTTPS 都关了），不需要 root。
    user: "${PUID}:${PGID}"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    healthcheck:
      # 挂载点不在说明核心没挂上，Caddy 照样能起来、对什么都回 404，所以一起查。
      test: ["CMD-SHELL", "test -d /srv/static && wget -q -O /dev/null http://127.0.0.1:8079/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

  # web_storage：没有现成服务端能按头选目录、按插件限额回 507，自己写的小服务（images/wonton-web-storage/）。
  # 核心把 <核心数据目录>/hosted/web_storage/ 读写挂到 provides.web_storage.mount。
  storage:
    image: ghcr.io/wontonapp/wonton-web-storage:0.1.0
    # 写进挂载目录的文件属主是 PUID:PGID，和核心建的插件子目录一致。
    user: "${PUID}:${PGID}"
    healthcheck:
      # /healthz 查挂载点是可写的目录，不只是进程活着。
      test: ["CMD", "/usr/local/bin/wonton-web-storage", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

configs:
  caddyfile:
    file: Caddyfile

x-wonton:
  spec: "0.12"
  id: app.wonton.static-host
  version: 0.1.0
  kind: system
  title: { zh: 小网页书架（Caddy）, en: Mini Page Shelf (Caddy) }
  description:
    zh: 像一个放小网页的书架，家里那些小游戏、小工具都放在这里，在 App 里一点就开。比如 Agent 帮你做的贪吃蛇，或者能记东西的待办清单。
    en: >-
      Like a bookshelf for small web pages: the little games and tools in your home live here and open with one tap in
      the app. For example, a snake game your agent made, or a to-do list that remembers what you add.
  icon: icon.svg
  notices: [NOTICE]
  author: { name: Wonton, url: https://github.com/wontonapp }
  homepage: https://github.com/wontonapp/wonton-plugin-static-host
  # Caddy（Apache-2.0）提供静态网页；数据存储是本仓库自己写的（MIT）。
  license: Apache-2.0 AND MIT
  tags: { zh: [系统], en: [System] }
  about:
    zh: |
      这些小网页不用各自开一个程序，全靠它一个打开，省内存。网页记下的东西（比如待办事项）也存在这里，每个网页最多 64 MiB。
      它停了，这些小网页就都打不开；卸掉它之前要先卸掉用它的小网页。
    en: |
      The small pages don't each need a program of their own; this one opens them all, which saves memory. What a page
      remembers (a to-do list, say) is kept here too, up to 64 MiB per page. If it stops, none of these pages open; uninstall
      the pages that use it before uninstalling it.
  release_notes: { zh: 第一版。, en: First release. }
  provides:
    static_web: { service: static, port: 8080, mount: /srv/static }
    web_storage: { service: storage, port: 8081, mount: /srv/data }
  # 不出网：只回答核心网关转来的请求。
  permissions: []
  # 两个镜像都有 amd64 和 arm64；内存按空闲实测取整（见 README）。
  requirements:
    arch: [amd64, arm64]
    memory: 64M
