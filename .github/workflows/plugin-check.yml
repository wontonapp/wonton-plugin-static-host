name: 插件检查

on:
  workflow_call:
    inputs:
      core-image:
        description: 核心镜像（留空使用 scripts/lib.sh 的默认值）
        required: false
        type: string
        default: ''
      upgrade-from:
        description: 冒烟“升级保数据”的起点（提交或 tag）；留空取最近的 tag
        required: false
        type: string
        default: ''
  # 手动入口：从“检查”工作流（check.yml）触发，或在模板仓库直接跑本工作流验证冒烟作业。
  workflow_dispatch:
    inputs:
      core-image:
        description: 核心镜像（留空使用 scripts/lib.sh 的默认值）
        required: false
        type: string
        default: ''
      upgrade-from:
        description: 冒烟“升级保数据”的起点（提交或 tag）；留空取最近的 tag
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # 可复用工作流检出的是调用方的插件仓库，不是套件仓库。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 只数代码行：空行和只有注释的行不算（去掉首尾空白后以注释符开头的行，以及 /* */ 块里的行），不做完整的语法分析。
      # 超过 800 行警告，是该按职责拆的信号；超过 2000 行失败。不许为了缩短行数写难懂的代码：删注释、把多行挤成一行、
      # 把穷举的 match 改成 _、缩短有意义的名字都不行。
      - name: 源文件代码行数（超过 800 警告，超过 2000 失败）
        shell: python
        run: |
          import os
          import subprocess
          import sys

          WARN_LINES, FAIL_LINES = 800, 2000

          def code_lines(path):
              hash_comments = path.endswith(('.py', '.sh'))
              count, in_block = 0, False
              with open(path, encoding='utf-8', errors='replace') as source:
                  for raw_line in source:
                      line = raw_line.strip()
                      if in_block:
                          in_block = '*/' not in line
                      elif not line:
                          pass
                      elif hash_comments:
                          count += not line.startswith('#')
                      elif line.startswith('/*'):
                          in_block = '*/' not in line[2:]
                      else:
                          count += not line.startswith('//')
              return count

          paths = subprocess.check_output([
              'git', 'ls-files', '-z', '--',
              '*.rs', '*.py', '*.sh', '*.js', '*.ts', '*.go', '*.kt', '*.swift',
          ]).split(b'\0')
          failed = False
          for raw_path in filter(None, paths):
              path = os.fsdecode(raw_path)
              lines = code_lines(path)
              if lines > FAIL_LINES:
                  print(f'{path!r}: {lines} 行代码（不算空行和注释，上限 {FAIL_LINES}），按职责拆开')
                  failed = True
              elif lines > WARN_LINES:
                  print(f'::warning file={path}::{path} 有 {lines} 行代码（不算空行和注释），超过 {WARN_LINES}，按职责拆')
          sys.exit(1 if failed else 0)
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: dev.sh 的 logs 和 diag（假 docker，不用真的 Docker）
        run: scripts/dev_test.sh
      # 插件仓库是公开的，核心的设计记录（ADR）在私有仓库里，读者打不开：注释、README、NOTICE 里写编号只会留下死链，
      # 要讲的道理直接写在原处。
      - name: 不引用 ADR 编号
        run: |
          if git grep -nIE 'ADR-?[0-9]{2,4}'; then
            echo "上面这些行引用了 ADR 编号：插件仓库是公开的，读者看不到 ADR，把要说的原因直接写出来。" >&2
            exit 1
          fi
      # 官方要求（镜像按摘要固定、健康检查、标签、许可证、作者、声明等）里，摘要要等发布流程推完镜像才写回
      # compose，重建自家镜像的 PR 在发布前满足不了，所以 PR 上只跑非官方检查；官方要求由 publish.sh --official
      # 在推镜像、写回摘要之后统一查。
      - name: 插件包检查
        env:
          WONTON_CORE_IMAGE: ${{ inputs.core-image }}
        run: scripts/check.sh
      - name: Rust 格式、Clippy 和测试
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          if [[ ! -f clippy.toml && ! -f .clippy.toml ]]; then
            # Clippy 通过 CLIPPY_CONF_DIR 选择配置目录，而非通过环境变量设置单个阈值。
            # https://doc.rust-lang.org/clippy/configuration.html
            # https://doc.rust-lang.org/clippy/lint_configuration.html#too-many-lines-threshold
            CLIPPY_CONF_DIR="$(mktemp -d "$RUNNER_TEMP/clippy.XXXXXX")"
            export CLIPPY_CONF_DIR
            printf 'too-many-lines-threshold = 100\n' > "$CLIPPY_CONF_DIR/clippy.toml"
          fi
          cargo clippy --all-targets -- -D warnings -W clippy::too_many_lines
          cargo test

  smoke:
    # 依赖镜像的升级 PR 合并前要过端到端冒烟（scripts/dev.sh smoke，四项真实请求，不用 mock）。
    # 判“Dependabot 的 PR”同时看 actor 和 PR 作者：Dependabot 自己 rebase 时 actor 是 dependabot[bot]，
    # 但任何人往 Dependabot 分支推 commit 都会把 actor 顶掉，PR 作者不会变。
    # Dependabot 的 PR 拿到的是只读令牌：这一步只检出和起本地容器，不用仓库密钥、不写仓库。
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # 可复用工作流检出的是调用方的插件仓库，不是套件仓库。
      # 要全量历史和 tag：smoke 用 git describe 找上一个发布 tag 测“升级保数据”，浅检出没有 tag，这一项会一直是 N/A。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # 出口代理：声明 network.egress 的插件经核心的出口容器出网，出口容器把流量转发到
      # 这里起的转发代理；装时要出网的插件（如 openclaw 的 init 装 npm 包）没有它就装不上。
      # 镜像和核心出口容器是同一个（gogost/gost，MIT，按摘要固定）。端口只绑 Docker 网桥的网关地址，
      # 不对公网暴露。对不出网的插件没有副作用：核心只为声明了 egress 的插件网络接出口容器，
      # smoke 配好代理后会先探测这条链路，不通时冒烟当场失败并写明原因。
      - name: 起出口代理
        run: |
          gw="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          docker run -d --name wonton-ci-egress -p "${gw}:3128:3128" \
            gogost/gost:3@sha256:f266f957c6e4f8d433ed23202a5745fa4969d08f3f0ef034fb9357345e16ad67 \
            -L "http://:3128"
          for i in $(seq 1 10); do
            curl -fsS -x "http://${gw}:3128" -o /dev/null https://github.com && break
            if [[ "$i" == 10 ]]; then docker logs wonton-ci-egress; exit 1; fi
            sleep 1
          done
          echo "WONTON_DEV_EGRESS_PROXY=http://${gw}:3128" >> "$GITHUB_ENV"
      - name: 端到端冒烟（装得上、网页打得开、用户身份能用、工具 Bot 调得到）
        env:
          WONTON_CORE_IMAGE: ${{ inputs.core-image }}
          UPGRADE_FROM: ${{ inputs.upgrade-from }}
        # 指定起点时在 runner 本地打一个 tag 交给 smoke，不推到仓库：公开仓库里的 tag 会和以后正式发版的版本号撞上。
        run: |
          if [[ -n "$UPGRADE_FROM" ]]; then
            git tag -f smoke-upgrade-base "$UPGRADE_FROM"
            scripts/dev.sh smoke --upgrade-from smoke-upgrade-base
          else
            scripts/dev.sh smoke
          fi
      # 拉镜像、健康检查、探测这些失败原因只在 .wonton/smoke.log 里，不打出来就没法分诊。
      # 令牌和会话 cookie 按约定只进 .env 和 cookie 文件，不进日志；这里仍按键名掩掉
      # credential 形态的值，防止哪个探测把带令牌的地址或响应原样打进来（sha256 摘要不受影响）。
      - name: 冒烟日志末尾（失败时）
        if: failure()
        run: |
          log=".wonton/smoke.log"
          if [[ ! -s "$log" ]]; then
            echo "（$log 不存在或为空：冒烟在写日志前就退出了）"
            exit 0
          fi
          python3 - "$log" "$RUNNER_TEMP/smoke-redacted.log" <<'PY'
          import re
          import sys

          src, dst = sys.argv[1], sys.argv[2]
          # 键名允许带前缀（WONTON_SECRET_OWNER_PASSWORD、X-Auth-Token），键右侧要词边界。
          keys = (r"(?:[\w.-]+[-_])?(?:client_secret|access_token|refresh_token|session_token|"
                  r"api[-_]?key|password|passwd|secret|token|authorization)\b")
          patterns = [
              # Authorization: Bearer xxx 先掩，避免键值对规则把 "Bearer" 当值掩掉、令牌留下。
              re.compile(r"(?i)(bearer\s+)(\S+)()"),
              # key="value"
              re.compile(rf"(?i)(\b{keys}\s*=\s*[\"'])([^\"']*)([\"'])"),
              # key=value、key: value（URL 查询串、环境变量、YAML）
              re.compile(rf"(?i)(\b{keys}\s*[:=]\s*)([^\s&\"']+)()"),
          ]

          def mask(m: re.Match) -> str:
              prefix, value, suffix = m.group(1), m.group(2), m.group(3)
              if value.startswith("${") or value.lower() == "bearer":
                  return m.group(0)  # 变量引用和scheme词不是密钥，留着好排错
              return f"{prefix}***{suffix}"

          with open(dst, "w", encoding="utf-8") as out:
              for line in open(src, encoding="utf-8", errors="replace"):
                  for pat in patterns:
                      line = pat.sub(mask, line)
                  out.write(line)
          PY
          echo "== .wonton/smoke.log 末尾 80 行（已脱敏；完整日志见 artifact smoke-log）=="
          tail -n 80 "$RUNNER_TEMP/smoke-redacted.log"
      - name: 上传冒烟日志（失败时）
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-log
          path: ${{ runner.temp }}/smoke-redacted.log
          if-no-files-found: ignore
