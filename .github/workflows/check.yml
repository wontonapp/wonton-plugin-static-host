name: 检查

on:
  pull_request:
  push:
    branches: [main]
  # 手动入口：想合并前跑一遍冒烟时，从这里触发（冒烟作业只在 Dependabot 的 PR 和手动触发时跑）。
  workflow_dispatch:
    inputs:
      core-image:
        description: 核心镜像（如 ghcr.io/wontonapp/wonton-core:sha-<完整 40 位提交号>，钉在某次合并上复测；留空用仓库变量 WONTON_CORE_IMAGE，再留空用套件默认的 :main）
        required: false
        type: string
        default: ''
      upgrade-from:
        description: 冒烟“升级保数据”的起点（提交或 tag，只在本次运行里打本地 tag，不推）；留空取最近的 tag
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    uses: geraldpeng6/wonton-plugin-template/.github/workflows/plugin-check.yml@5f3bcb434b43f55375618763ec5572f243823e67
    with:
      # 优先级：手动触发填的输入 > 仓库变量 WONTON_CORE_IMAGE（要固定别的核心镜像，例如套件默认镜像
      # 还没有某个新能力时，在仓库 Settings → Variables 里设）> 套件默认（空，走 scripts/lib.sh 的默认值）。
      core-image: ${{ inputs.core-image || vars.WONTON_CORE_IMAGE }}
      upgrade-from: ${{ inputs.upgrade-from }}
